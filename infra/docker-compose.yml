# Development stack. Run from repo root:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
# (--env-file is required: compose otherwise looks for .env next to this file)
#
# Dev exposes Neo4j on localhost only. In production, nothing but the gateway
# (behind Caddy) publishes a port; backend and Neo4j live on the internal
# network — see docs/plan.md "Target architecture".

services:
  neo4j:
    image: neo4j:5-community
    container_name: vaivia-neo4j
    # Host ports are configurable so this stack can coexist with another Neo4j
    # already bound to the defaults. Override in the root .env and keep
    # NEO4J_URI in backend/.env pointing at the same bolt port.
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474" # HTTP browser (dev only)
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687" # Bolt (dev only)
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      # Procedure allowlist: what the query service is permitted to CALL. This is
      # the read-only boundary for model-GENERATED Cypher (docs/fragilities.md #15)
      # — Community has no RBAC, so it is an allowlist, not a grant. It denies
      # every apoc.* procedure (34 of which are dangerous: apoc.cypher.doIt is a
      # WRITE-moded arbitrary-string executor, apoc.load.json is SSRF) while
      # keeping exactly what we call, verified against every CALL in the repo:
      #   db.index.fulltext.queryNodes   POI name resolution
      #   db.index.vector.queryNodes     semantic search
      #   db.create.setNodeVectorProperty  embedding write (ingestion)
      #   gds.*                          routing (Dijkstra) and its projection lifecycle
      # dbms.* stays for driver routing; narrowing it further is a later tightening.
      NEO4J_dbms_security_procedures_allowlist: "db.*,dbms.*,gds.*"
      # A hard cap on any single transaction. The driver's per-query timeout does
      # NOT bite while this is 0 (measured 2026-08-21, docs/fragilities.md #15), so
      # THIS is the availability control for a pathological generated read.
      NEO4J_db_transaction_timeout: "10s"
      # Neo4j 5 names: the dbms.memory.* forms still work but log a deprecation
      # warning on every boot.
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2g"
      NEO4J_server_memory_pagecache_size: "1g"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  graphhopper:
    # Geometry and elevation; Neo4j keeps meaning (docs/routing-engine.md).
    # Dev-only port binding, like Neo4j: it is an internal service, and nothing
    # but the gateway is public.
    image: israelhikingmap/graphhopper:latest
    container_name: vaivia-graphhopper
    ports:
      - "127.0.0.1:${GRAPHHOPPER_PORT:-8989}:8989"
    environment:
      # Import needs headroom; the served graph for one region is far smaller.
      JAVA_OPTS: "-Xmx${GRAPHHOPPER_HEAP:-4g} -Xms1g"
    # The image entrypoint hardcodes `-c config-example.yml`, so it must be
    # overridden rather than appended to — appending leaves the stock config
    # winning and our profiles silently absent.
    entrypoint: ./graphhopper.sh
    command: ["-c", "/data/config.yml", "-i", "/data/data/region.osm"]
    volumes:
      # config.yml, custom_models/ and data/ are the committed inputs; the
      # extract itself and the caches are generated and gitignored.
      - ./graphhopper/config.yml:/data/config.yml:ro
      - ./graphhopper/custom_models:/data/custom_models:ro
      - ./graphhopper/data:/data/data
      - graphhopper_cache:/data/graph-cache
      - graphhopper_srtm:/data/srtm-cache
    networks:
      - internal
    healthcheck:
      # Import takes minutes on a cold cache, so start_period is generous —
      # a shorter one just marks a healthy service unhealthy while it works.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8989/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s

  postgis:
    # The geodata pipeline's working store (pipeline/, docs/plan.md): staging,
    # curated route map, QA layers. Deliberately NOT the Supabase Postgres —
    # bulk geometry and raster tiles do not belong in the database production
    # auth depends on. The pgrouting image is postgis/postgis plus pgRouting,
    # which Phase 4's route enumeration (pgr_ksp) needs.
    image: pgrouting/pgrouting:17-3.5-3.8
    container_name: vaivia-postgis
    ports:
      - "127.0.0.1:${POSTGIS_PORT:-5433}:5432" # 5433: 5432 is Supabase's local pooler neighbourhood
    environment:
      POSTGRES_DB: ${POSTGIS_DB:-vaivia_geo}
      POSTGRES_USER: ${POSTGIS_USER:-vaivia}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:?set POSTGIS_PASSWORD in .env}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGIS_USER:-vaivia} -d ${POSTGIS_DB:-vaivia_geo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # backend and gateway services are added when their Dockerfiles land
  # (Phases 2 and 3 in docs/plan.md).

networks:
  internal:

volumes:
  postgis_data:
  neo4j_data:
  neo4j_logs:
  graphhopper_cache:
  graphhopper_srtm:
